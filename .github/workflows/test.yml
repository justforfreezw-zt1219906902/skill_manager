name: test

on:
  pull_request:
  push:
    branches:
      - main
      - feature/scoped-skill-management
      - feature/runtime-adapters

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile CLI
        run: |
          python -m py_compile skill-librarian/scripts/skill_librarian.py
          python -m py_compile skill-librarian/scripts/skill_librarian_core.py
          python -m py_compile skill-librarian/scripts/project_inventory.py
          python -m py_compile skill-librarian/scripts/skill_vendor.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
